<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline-First Notes</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
      .form { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
      input, textarea { width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
      textarea { height: 100px; }
      button { padding: 8px 16px; margin: 4px; cursor: pointer; }
      #save-btn { background: #2E5C8A; color: white; border: none; border-radius: 4px; }
      .note { background: white; border: 1px solid #ddd; padding: 16px; margin: 8px 0; border-radius: 4px; }
      .note h3 { margin: 0 0 8px 0; }
      .note small { color: #888; }
    </style>
  </head>
  <body>
    <h1>Offline-First Notes</h1>
    <div class="form">
      <input id="title" type="text" placeholder="Tytuł notatki" />
      <textarea id="content" placeholder="Treść notatki"></textarea>
      <button id="save-btn">Dodaj notatkę</button>
    </div>
    <div id="notes-list"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
